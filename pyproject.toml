[project]
name = "kilonova-hunter"
version = "0.1.0"
description = "Search Rubin Observatory alerts for kilonova candidates and explain each verdict."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sage Dombrowski", email = "139999736+SADHD@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "astropy",
    "matplotlib",
    "numpy",
    "pandas",
]

[project.scripts]
kilohunt = "kilonova_hunter.cli:main"

[project.optional-dependencies]
# Physical kilonova light curves for `kilohunt recall`.
# Install with: uv sync --extra sim
# Left out of the default install so tests and CI stay light.
sim = [
    "dustmaps>=1.0.14",
    # 1.20.0 is the version the diffusion wrapper was written for.
    # A newer redback may already include the missing factor of 2, and
    # the wrapper would apply it twice. Older releases are not checked.
    "redback==1.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: calls the real light-curve model and is expected to take longer",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "notebooks"]
# reference/ is the MOSFiT commit 6595248 text. Ruff must not reformat it.
extend-exclude = ["checks/mosfit/reference"]

[tool.ruff.lint]
# E and F catch real mistakes. I sorts imports. UP modernizes syntax.
# B flags a few easy-to-miss bugs, such as a mutable default argument.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# bootstrap.install() has to run before these scripts import sidebyside_lib
# and kilonova_hunter. Every other check in the file still runs.
"checks/mosfit/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["kilonova_hunter"]
