# Runs on every pull request, and again when commits land on main.
# A failure means Ruff found a problem, or a test no longer passes.
name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        # uv installs the Python version named in .python-version, then
        # the libraries locked in uv.lock. enable-cache reuses downloads
        # between runs so this step stays short.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the project
        # --locked refuses to run if uv.lock does not match pyproject.toml,
        # so a forgotten lockfile update fails here instead of silently
        # installing different versions.
        run: uv sync --locked

      - name: Check for mistakes with Ruff
        run: uv run ruff check

      - name: Check formatting with Ruff
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest

  test-sim:
    name: Ruff and pytest with the sim extra
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install a C compiler for the sim extra
        # sncosmo 2.13.1 has no Linux wheel, so this job compiles it.
        # uv's own Python 3.12 supplies the headers. Ubuntu 26 has no
        # python3.12-dev package.
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install the project with the sim extra
        # This job is what runs the redback wrapper tests and the
        # Planck18 redshift test. The job above skips them.
        run: uv sync --locked --extra sim

      - name: Check for mistakes with Ruff
        run: uv run ruff check

      - name: Check formatting with Ruff
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest

      - name: Rerun the MOSFiT checks against the committed output
        # Each checks/mosfit script that has a saved .out is run again.
        # stdout is the result table. Library logs stay on stderr, and the
        # bandpasses are in the repo, so a fresh runner does not download
        # them. A number may move by one unit in its last printed decimal.
        # Any other stdout change fails the job.
        run: uv run python scripts/diff_mosfit_outputs.py

      - name: The external-check CSV is unchanged by that rerun
        run: git diff --exit-code docs/mosfit_external_check.csv
